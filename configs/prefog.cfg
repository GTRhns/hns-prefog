// ============================================================
//  [义聚] PreFog 专属配置
//  基于开源 PreFog 3.2.4 魔改: 实时地速 + FOG + 跳跃距离
//  不在聊天框输出任何消息 (聊天框留给比赛系统)
// ============================================================

// HUD 位置 (X: -1.0 = 居中, Y: 0.55 = 屏幕中部偏下)
pre_x -1.0
pre_y 0.55

// HUD 频道 (1 = 独立频道, 避免与其他HUD冲突)
pre_hud 1

// ============================================================
//  100AA 说明:
//  FOG 帧数统计与 AA 模式无关, 插件自动适配。
//  服务器 100AA 由 sv_airaccelerate 100 控制, 无需在插件中设置。
// ============================================================
